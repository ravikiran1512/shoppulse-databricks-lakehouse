# Four sequential tasks: within the Free Edition limit of five concurrent tasks.
resources:
  jobs:
    shoppulse_batch:
      name: "ShopPulse - Olist batch lakehouse"
      description: "COPY INTO Bronze; validate Silver; build Gold; run quality gates"
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: ../src/shoppulse/runner.py
            parameters: ["--stage", "ingest", "--catalog", "${var.catalog}"]
          environment_key: default
        - task_key: silver
          depends_on:
            - task_key: ingest
          spark_python_task:
            python_file: ../src/shoppulse/runner.py
            parameters: ["--stage", "silver", "--catalog", "${var.catalog}"]
          environment_key: default
        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ../src/shoppulse/runner.py
            parameters: ["--stage", "gold", "--catalog", "${var.catalog}"]
          environment_key: default
        - task_key: quality
          depends_on:
            - task_key: gold
          spark_python_task:
            python_file: ../src/shoppulse/runner.py
            parameters: ["--stage", "quality", "--catalog", "${var.catalog}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

